[project]
name = "dial-aifriend"
version = "0.1.0"
description = "AI Voice Assistant - Phone-based technical assistant powered by OpenAI Realtime API and Twilio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "openai>=1.0.0",
    "twilio>=8.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.104.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
